name: Continuous Integration Pipeline

# 1. Trigger the pipeline automatically on every single code push to the main branch
on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    # 2. Spin up a clean, isolated cloud machine running Ubuntu Linux
    runs-on: ubuntu-latest

    steps:
    # Step 3: Pull down the source code from your GitHub repository onto the runner
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 4: Set up the correct Python environment version on the cloud runner
    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 5: Install test dependencies directly onto the runner system
    - name: Install Application and Test Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 6: Build the container image using the project Dockerfile
    - name: Build Docker Image
      run: docker build -t devops-app-ci .

    # Step 7: Launch the container in the background (detached mode)
    # Note: On GitHub's runner, we route to 127.0.0.1 directly instead of the VM IP
    - name: Run Containerized Application
      run: docker run -d -p 5000:5000 --name web-service-ci devops-app-ci

    # Step 8: Allow the Flask application a brief 2-second window to finish booting up
    - name: Wait for Service Initialization
      run: sleep 2

    # Step 9: Execute your PyTest automation suite against the running container
    - name: Execute Automated Test Suite
      run: pytest test_app.py
